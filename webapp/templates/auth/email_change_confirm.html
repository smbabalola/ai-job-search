{% extends "base.html" %}
{% block title %}Confirm your new email · Job Search Workspace{% endblock %}
{% block content %}
<section class="panel form-panel auth-panel">
  <h1>Confirm your new email address</h1>
  {% if errors %}<ul class="form-errors" role="alert">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>{% else %}
  <form method="post" action="/auth/email-change/confirm">
    <input type="hidden" name="token" value="{{ token }}">
    <button class="button" type="submit">Confirm</button>
  </form>{% endif %}
</section>
{% endblock %}
