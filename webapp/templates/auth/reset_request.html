{% extends "base.html" %}
{% block title %}Reset your password · Job Search Workspace{% endblock %}
{% block content %}
<section class="panel form-panel auth-panel">
  <h1>Reset your password</h1>
  {% if sent %}<p role="status">If an account uses that address, we've emailed a reset link. It expires in 1 hour.</p>{% endif %}
  <form method="post" action="/auth/password-reset/request"><input type="hidden" name="csrf_token" value="{{ request.state.csrf_token or '' }}">
    <label>Email <input name="email" type="email" autocomplete="email" required></label>
    <button class="button" type="submit">Send reset link</button>
  </form>
</section>
{% endblock %}
