{% extends "base.html" %}
{% block title %}Verify your email · Job Search Workspace{% endblock %}
{% block content %}
<section class="panel form-panel auth-panel">
  <h1>Verify your email</h1>
  {% if errors %}<ul class="form-errors" role="alert">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>
  <p><a href="/check-email">Send a new link</a></p>{% else %}
  <form method="post" action="/auth/verify-email">
    <input type="hidden" name="token" value="{{ token }}">
    <button class="button" type="submit">Verify my email</button>
  </form>{% endif %}
</section>
{% endblock %}
