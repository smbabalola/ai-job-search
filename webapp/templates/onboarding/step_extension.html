{% extends "onboarding/_layout.html" %}
{% block step %}
<p>The browser extension fills application forms on employer sites for you to check and submit.</p>
{% if paired %}<p>Your browser extension is connected.</p>{% else %}<p><a class="button secondary" href="/pairing">Connect the extension</a></p>{% endif %}
<form method="post" action="/onboarding/extension/done"><input type="hidden" name="csrf_token" value="{{ request.state.csrf_token or '' }}"><button class="button" type="submit">Finish</button></form>
{% endblock %}
