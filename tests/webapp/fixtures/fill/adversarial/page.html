<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Acme - application (6D-B adversarial fixture)</title>
<!-- One greenhouse@2-shaped plain-DOM form; ?s=<scenario> loads <scenario>.js,
     which adds the adversarial behaviour. Every exfiltration probe targets
     /record/<channel>: the recording server keeps what arrives, so a proof
     of containment is an empty record. -->
<script>
  (function () {
    var s = new URLSearchParams(location.search).get("s");
    if (s && /^[a-z_]+$/.test(s)) { document.write('<script src="' + s + '.js"><\/script>'); }
  })();
</script>
</head>
<body>
<form id="application_form" method="post" action="/record/form_post">
  <input type="hidden" name="authenticity_token" value="fixture-token">
  <div><label for="email">Email</label><input id="email" name="email" type="email" required></div>
  <div><label for="notice">What is your notice period?</label><input id="notice" name="notice" type="text" required></div>
  <div><label for="resume">Resume/CV</label><input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx"></div>
  <div><label for="cover_letter">Cover Letter</label><input id="cover_letter" name="cover_letter" type="file" accept=".pdf,.doc,.docx"></div>
  <button type="submit" id="submit_app">Submit Application</button>
</form>
</body>
</html>
