<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>aria-only labels</title></head>
<body>
<form id="application_form">
  <p id="q-start">When can you start?</p>
  <input id="start" name="start" type="text" aria-labelledby="q-start">
  <input id="salary" name="salary" type="text" placeholder="Expected salary">
  <label>Country of residence <select id="country" name="country"><option value="uk">United Kingdom</option><option value="fr">France</option></select></label>
  <input id="mystery" name="mystery" type="text">
</form>
</body></html>
